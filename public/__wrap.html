<!doctype html><meta charset=utf-8><style>html,body{margin:0;overflow:hidden;background:#fff}iframe{border:0;display:block}</style>
<iframe id=f src="/"></iframe>
<script>var q=new URLSearchParams(location.search),f=document.getElementById('f');
f.style.width=(q.get('w')||1600)+'px';f.style.height=(q.get('h')||900)+'px';
var y=parseInt(location.hash.slice(1)||'0',10);
f.addEventListener('load',function(){var w=f.contentWindow,n=0;(function s(){n++;if(n>30)w.scrollTo(0,y);if(n<220)requestAnimationFrame(s);})();});</script>
